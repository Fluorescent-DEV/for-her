<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        /* CSS Kamu sudah ada di dalam sini */
        body { background-color: #0f0208; color: white; text-align: center; font-family: sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .photo-frame { width: 300px; border-radius: 20px; overflow: hidden; border: 3px solid #ff527b; margin: 20px; }
        img { width: 100%; display: block; }
        audio { margin-top: 20px; width: 300px; }
    </style>
</head>
<body>
    <h1>For You, My Everything</h1>
    <div class="photo-frame">
        <img src="foto-dia.jpg" alt="Foto Dia">
    </div>
    <audio controls autoplay loop src="musikku.mp3"></audio>
</body>
</html>
