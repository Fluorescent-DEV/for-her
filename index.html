<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>For You</title>
  <style>
    /* SEMUA STYLE PINDAH KE SINI */
    body { background-color: #0f0208; color: #fff; font-family: sans-serif; margin: 0; text-align: center; }
    .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .photo-frame { width: 260px; height: 360px; border-radius: 20px; overflow: hidden; border: 2px solid #fff; margin: 20px auto; }
    .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
    .music-widget { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 20px; display: inline-block; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>For You, My Everything</h1>
    <div class="photo-frame"><img src="foto-dia.jpg" alt="Foto"></div>
    <div class="music-widget">
      <audio controls autoplay loop src="musikku.mp3"></audio>
    </div>
  </div>
</body>
</html>
