<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        /* CSS LENGKAP */
        body { background-color: #0f0208; color: #fff; font-family: 'Georgia', serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow-x: hidden; }
        h1 { color: #ff8da1; margin-bottom: 20px; font-size: 2.5rem; text-shadow: 0 0 10px rgba(255,141,161,0.5); }
        .photo-frame { width: 300px; height: 400px; border-radius: 20px; overflow: hidden; border: 4px solid #ff527b; box-shadow: 0 0 20px rgba(255,82,123,0.5); margin-bottom: 30px; }
        img { width: 100%; height: 100%; object-fit: cover; }
        .music-widget { background: rgba(255, 255, 255, 0.1); padding: 20px; border-radius: 15px; backdrop-filter: blur(10px); }
        /* Animasi Bunga Jatuh */
        #blossom-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .petal { position: absolute; background-color: #ffb7c5; border-radius: 15% 70%; animation: fall linear infinite; opacity: 0.6; }
        @keyframes fall { to { transform: translateY(100vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="blossom-container"></div>

    <h1>For You, My Everything</h1>
    <div class="photo-frame">
        <img src="foto-dia.jpg" alt="Foto">
    </div>
    
    <div class="music-widget">
        <audio controls autoplay loop src="musikku.mp3"></audio>
    </div>

    <script>
        /* JS UNTUK ANIMASI BUNGA */
        function createPetal() {
            const container = document.getElementById('blossom-container');
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.width = Math.random() * 10 + 5 + 'px';
            petal.style.height = petal.style.width;
            petal.style.animationDuration = Math.random() * 5 + 5 + 's';
            container.appendChild(petal);
            setTimeout(() => petal.remove(), 10000);
        }
        setInterval(createPetal, 500);
    </script>
</body>
</html>
